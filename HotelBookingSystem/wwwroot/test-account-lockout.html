<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Account Lockout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>
    <div class="container mt-4">
        <h2>Test Account Lockout Security</h2>

        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Test AJAX Request</h5>
                    </div>
                    <div class="card-body">
                        <p>Test xem user bị khóa có thể gọi API không:</p>
                        <button id="testAjax" class="btn btn-primary">Test AJAX Request</button>
                        <div id="ajaxResult" class="mt-3"></div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Test Regular Navigation</h5>
                    </div>
                    <div class="card-body">
                        <p>Test xem user bị khóa có thể vào các trang không:</p>
                        <a href="/Bookings" class="btn btn-warning">Go to Bookings</a>
                        <a href="/Rooms" class="btn btn-info">Go to Rooms</a>
                        <a href="/Admin" class="btn btn-danger">Go to Admin</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5>Current User Status</h5>
                    </div>
                    <div class="card-body">
                        <button id="checkStatus" class="btn btn-success">Check User Status</button>
                        <div id="statusResult" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            $('#testAjax').click(function () {
                $.ajax({
                    url: '/api/test',
                    method: 'GET',
                    success: function (data) {
                        $('#ajaxResult').html('<div class="alert alert-success">AJAX Success: ' + JSON.stringify(data) + '</div>');
                    },
                    error: function (xhr, status, error) {
                        if (xhr.status === 401) {
                            try {
                                var response = JSON.parse(xhr.responseText);
                                $('#ajaxResult').html('<div class="alert alert-danger">Account Locked: ' + response.error + '</div>');
                            } catch (e) {
                                $('#ajaxResult').html('<div class="alert alert-danger">401 Unauthorized</div>');
                            }
                        } else {
                            $('#ajaxResult').html('<div class="alert alert-warning">Error: ' + error + ' (Status: ' + xhr.status + ')</div>');
                        }
                    }
                });
            });

            $('#checkStatus').click(function () {
                $.ajax({
                    url: '/Account/CheckStatus',
                    method: 'GET',
                    success: function (data) {
                        $('#statusResult').html('<div class="alert alert-info">Status: ' + JSON.stringify(data) + '</div>');
                    },
                    error: function (xhr, status, error) {
                        $('#statusResult').html('<div class="alert alert-danger">Error checking status: ' + error + '</div>');
                    }
                });
            });
        });
    </script>
</body>

</html>
